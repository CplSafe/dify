version: 0.0.1
type: plugin
author: hsbst
name: doubao_voice
description:
  en_US: Doubao (Volcengine) voice models, supports TTS and ASR.
  zh_Hans: 豆包（火山引擎）语音模型，支持文字转语音（TTS）和语音转文字（ASR）。
icon: icon.svg
label:
  en_US: Doubao Voice
  zh_Hans: 豆包语音
created_at: "2026-05-21T00:00:00+08:00"
resource:
  memory: 268435456
  permission:
    model:
      enabled: true
      llm: false
      text_embedding: false
      rerank: false
      tts: true
      speech2text: true
      moderation: false
plugins:
  models:
    - "provider/doubao_voice.yaml"
meta:
  version: 0.0.1
  arch:
    - "amd64"
    - "arm64"
  runner:
    language: "python"
    version: "3.12"
    entrypoint: "main"
