provider: doubao_voice
label:
  en_US: Doubao Voice
  zh_Hans: 豆包语音
description:
  en_US: Doubao (Volcengine) voice models, supports TTS and ASR.
  zh_Hans: 豆包（火山引擎）语音模型，支持文字转语音（TTS）和语音转文字（ASR）。
icon_small:
  en_US: icon.svg
icon_large:
  en_US: icon.svg
background: "#E5E7EB"
help:
  title:
    en_US: Get your API Key from the Volcengine Doubao Voice console
    zh_Hans: 从火山引擎豆包语音控制台获取 API Key
  url:
    en_US: https://console.volcengine.com/speech/app
supported_model_types:
  - tts
  - speech2text
configurate_methods:
  - predefined-model
provider_credential_schema:
  credential_form_schemas:
    - variable: api_key
      label:
        en_US: API Key
        zh_Hans: API Key
      type: secret-input
      required: true
      placeholder:
        en_US: Enter your Doubao Voice X-Api-Key
        zh_Hans: 填入豆包语音 X-Api-Key
models:
  tts:
    predefined:
      - "models/tts/*.yaml"
  speech2text:
    predefined:
      - "models/speech2text/*.yaml"
extra:
  python:
    provider_source: provider/doubao_voice.py
    model_sources:
      - "models/tts/tts.py"
      - "models/speech2text/speech2text.py"
